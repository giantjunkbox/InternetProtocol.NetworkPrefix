# Builds and tests every push, and publishes the package to NuGet when a version tag such as v3.0.0 is pushed.
#
# Publishing needs a nuget.org API key in a repository secret named NUGET_API_KEY. The tag must match the version in
# Bitvantage.IPNetworkExtensions.csproj, so bump the version there before tagging.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch makes an unfinished build of it pointless, but a release is never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    # a pull request from a branch of this repository was already built when the branch was pushed, so only pull requests
    # from forks are built again
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # the Network tests look up real host names, which a build machine may not be able to do
      - name: Test
        run: dotnet test --configuration Release --no-build --filter "TestCategory!=Network"

      - name: Pack
        run: dotnet pack Bitvantage.IPNetworkExtensions --configuration Release --no-build --output packages

      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: packages
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v6
        with:
          name: packages
          path: packages

      # catches a tag pushed without bumping the version, which would otherwise publish the old version again
      - name: Check that the tag matches the package version
        run: |
          packageFile="packages/Bitvantage.IPNetworkExtensions.${GITHUB_REF_NAME#v}.nupkg"
          if [ ! -f "$packageFile" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the package version. Found: $(ls packages)"
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # pushing the .nupkg also pushes the .snupkg symbol package beside it
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
